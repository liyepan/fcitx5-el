name: 1. Check upstream versions

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Run the build workflow even if upstream versions have not changed"
        required: true
        type: boolean
        default: false
  push:
    paths:
      - ".github/workflows/1.check-upstream.yml"
      - ".github/workflows/2.build.yml"
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
      versions_json: ${{ steps.versions.outputs.json }}
      release_tag: ${{ steps.versions.outputs.release_tag }}
    steps:
      - name: Collect latest upstream tags
        id: versions
        shell: bash
        run: |
          set -euo pipefail
          repos=(
            "fcitx/fcitx5"
            "fcitx/fcitx5-qt"
            "fcitx/fcitx5-gtk"
            "fcitx/fcitx5-configtool"
            "fcitx/fcitx5-rime"
            "rime/librime"
          )
          json='{}'
          for repo in "${repos[@]}"; do
            tag="$(git ls-remote --tags --refs "https://github.com/${repo}.git" \
              | awk -F/ '{print $NF}' \
              | grep -E '^[vV]?[0-9]+\.[0-9]+' \
              | sort -Vu | tail -n1 || true)"
            if [[ -z "$tag" ]]; then
              echo "::error::Could not determine latest version tag for $repo"
              exit 1
            fi
            json="$(jq -cn --argjson old "$json" --arg repo "$repo" --arg tag "$tag" '$old + {($repo): $tag}')"
          done
          echo "json=$json" >> "$GITHUB_OUTPUT"
          digest="$(printf '%s' "$json" | sha256sum | cut -c1-16)"
          echo "release_tag=upstream-$digest" >> "$GITHUB_OUTPUT"
          echo "Upstream versions: $json"

      - name: Compare with latest published release
        id: compare
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CURRENT_JSON: ${{ steps.versions.outputs.json }}
          FORCE: ${{ inputs.force || false }}
        run: |
          set -euo pipefail
          if [[ "$FORCE" == "true" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          latest_body="$(gh release view --repo "$REPO" --json body --jq '.body' 2>/dev/null || true)"
          previous_json="$(printf '%s\n' "$latest_body" | sed -n 's/^UPSTREAM_VERSIONS_JSON=//p' | head -n1)"

          if [[ "$CURRENT_JSON" != "$previous_json" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.changed == 'true'
    uses: ./.github/workflows/2.build.yml
    with:
      versions_json: ${{ needs.check.outputs.versions_json }}
      release_tag: ${{ needs.check.outputs.release_tag }}
      force: ${{ inputs.force || false }}
    permissions:
      contents: write

name: Check upstream

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: fcitx5-el-upstream-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
      versions: ${{ steps.versions.outputs.json }}
    steps:
      - name: Get latest upstream tags
        id: versions
        shell: bash
        run: |
          set -euo pipefail
          get_tag() {
            local repo="$1"
            git ls-remote --tags --refs "https://github.com/${repo}.git" \
              | awk -F/ '{print $NF}' \
              | grep -E '^v?[0-9]' \
              | sort -V \
              | tail -n1
          }

          fcitx5="$(get_tag fcitx/fcitx5)"
          fcitx5_qt="$(get_tag fcitx/fcitx5-qt)"
          fcitx5_gtk="$(get_tag fcitx/fcitx5-gtk)"
          fcitx5_configtool="$(get_tag fcitx/fcitx5-configtool)"
          fcitx5_rime="$(get_tag fcitx/fcitx5-rime)"
          librime="$(get_tag rime/librime)"
          test -n "$fcitx5"
          test -n "$fcitx5_qt"
          test -n "$fcitx5_gtk"
          test -n "$fcitx5_configtool"
          test -n "$fcitx5_rime"
          test -n "$librime"

          json="$(jq -cn \
            --arg fcitx5 "$fcitx5" \
            --arg fcitx5_qt "$fcitx5_qt" \
            --arg fcitx5_gtk "$fcitx5_gtk" \
            --arg fcitx5_configtool "$fcitx5_configtool" \
            --arg fcitx5_rime "$fcitx5_rime" \
            --arg librime "$librime" \
            '{fcitx5:$fcitx5,fcitx5_qt:$fcitx5_qt,fcitx5_gtk:$fcitx5_gtk,fcitx5_configtool:$fcitx5_configtool,fcitx5_rime:$fcitx5_rime,librime:$librime}')"
          echo "json=$json" >> "$GITHUB_OUTPUT"
          echo "Upstream versions: $json"

      - name: Compare with latest successful project release
        id: compare
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CURRENT: ${{ steps.versions.outputs.json }}
        shell: bash
        run: |
          set -euo pipefail
          latest="$(gh release view --repo "$REPO" --json body --jq '.body' 2>/dev/null || true)"
          previous="$(printf '%s\n' "$latest" | sed -n 's/^UPSTREAM_VERSIONS_JSON=//p' | tail -n1)"
          if [[ -z "$previous" || "$previous" != "$CURRENT" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Upstream changed (or no prior release exists)."
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No upstream changes."
          fi

      - name: Dispatch build workflow
        if: steps.compare.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: gh workflow run build.yml --repo "$REPO" --ref "${GITHUB_REF_NAME:-main}"
